<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion de Tickets de Maintenance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .badge-urgent { background-color: #fee2e2; color: #991b1b; }
    .badge-haute { background-color: #ffedd5; color: #9a3412; }
    .badge-normale { background-color: #e0e7ff; color: #3730a3; }
    .badge-basse { background-color: #f3f4f6; color: #1f2937; }
    
    .status-nouveau { background-color: #dbeafe; color: #1e40af; }
    .status-en_cours { background-color: #fef3c7; color: #92400e; }
    .status-resolu { background-color: #dcfce7; color: #166534; }
    .status-ferme { background-color: #f3f4f6; color: #374151; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- En-tête -->
  <header class="bg-slate-900 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <svg class="w-8 h-8 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 001 1.732 3 3 0 010 5.536A2 2 0 003 17v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 00-1-1.732 3 3 0 010-5.536A2 2 0 0021 10V7a2 2 0 00-2-2H5z"/>
        </svg>
        <h1 class="text-xl font-bold tracking-wide">Ticketing Maintenance</h1>
      </div>

      <div class="flex items-center space-x-3">
        <!-- Status de connexion Supabase -->
        <span id="supabaseStatus" class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-amber-500/20 text-amber-300 border border-amber-500/30">
          <span class="w-2 h-2 mr-1.5 rounded-full bg-amber-400 animate-pulse"></span> Mode Local
        </span>

        <!-- Zone Auth Utilisateur -->
        <div id="authZone" class="flex items-center space-x-2">
          <!-- Injecté par JS : Bouton Se connecter ou Profil + Déconnexion -->
        </div>

        <button onclick="openConfigModal()" class="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition" title="Configuration Supabase">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Contenu Principal -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">

    <!-- Barre de Contrôle : Recherche, Filtres, Nouveau Ticket -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-wrap gap-4 items-center justify-between">
      <div class="flex flex-wrap gap-3 items-center flex-grow max-w-3xl">
        <!-- Recherche -->
        <div class="relative flex-grow min-w-[200px]">
          <input type="text" id="searchInput" oninput="renderTickets()" placeholder="Rechercher un ticket..." class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <svg class="w-4 h-4 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>

        <!-- Filtre Statut -->
        <select id="filterStatus" onchange="renderTickets()" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
          <option value="all">Tous les statuts</option>
          <option value="Nouveau">Nouveau</option>
          <option value="En cours">En cours</option>
          <option value="Résolu">Résolu</option>
          <option value="Fermé">Fermé</option>
        </select>

        <!-- Filtre Priorité -->
        <select id="filterPriority" onchange="renderTickets()" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
          <option value="all">Toutes les priorités</option>
          <option value="Urgent">Urgent</option>
          <option value="Haute">Haute</option>
          <option value="Normale">Normale</option>
          <option value="Basse">Basse</option>
        </select>
      </div>

      <!-- Bouton Créer -->
      <button onclick="handleNewTicketClick()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg text-sm flex items-center space-x-2 transition shadow-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        <span>Nouveau Ticket</span>
      </button>
    </div>

    <!-- Liste des Tickets -->
    <div id="ticketsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- Injecté dynamiquement -->
    </div>

  </main>

  <!-- Modal : Créer / Éditer Ticket -->
  <div id="ticketModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-40">
    <div class="bg-white rounded-xl shadow-xl max-w-lg w-full overflow-hidden border border-slate-200">
      <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
        <h3 id="modalTitle" class="font-bold text-slate-800">Nouveau Ticket</h3>
        <button onclick="closeTicketModal()" class="text-slate-400 hover
